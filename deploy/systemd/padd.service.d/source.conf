# Match the existing privileged gamepad command and source build location.
[Service]
WorkingDirectory=/home/wonderduck/wonderduck
User=root
Group=robot
SupplementaryGroups=
ProtectHome=no
Environment=PADD_LAYOUT=classic
ExecStart=
ExecStart=/home/wonderduck/wonderduck/target/release/padd \
    --layout classic \
    --socket /run/robotd.sock \
    --config /etc/robot/robotd.toml
