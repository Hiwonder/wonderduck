[Service]
WorkingDirectory=/home/wonderduck/wonderduck
Group=robot
# Studio runs as the installation owner and uses sudo to save IMU calibration.
NoNewPrivileges=no
Environment=ORT_DYLIB_PATH=/home/wonderduck/wonderduck/onnxruntime-linux-aarch64-1.28.0/lib/libonnxruntime.so.1.28.0
Environment=ROBOT_FREEZE_POLICY_IMU=0
Environment=RUST_LOG=info
ExecStart=
ExecStart=/home/wonderduck/wonderduck/target/release/robotd \
    --enable-policies stand,ground_pick,sitstand,velocity,kick_left,kick_right \
    --head-lowpass 1 \
    --legs-lowpass 1 \
    --voltage-adapt false \
    --params /etc/robot/robotd.toml \
    --socket /run/robotd.sock \
    --imu-filter false \
    --max-linear 0.3 \
    --max-lateral 0.25 \
    --max-angular 1 \
    --imu-source id200 \
    --imu-last \
    --with-gamepad \
    --exit-head-30-ms 1000 \
    --exit-head-31-ms 750,500
